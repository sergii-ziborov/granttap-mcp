[package]
name = "granttap-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "GrantTap MCP server — phone/watch approvals over stdio (Rust, Tokio-free)"
license-file.workspace = true
authors = ["Sergii Ziborov"]
repository = "https://github.com/sergii-ziborov/granttap-mcp"
readme = "README.md"
publish = false

[[bin]]
name = "granttap-mcp"
path = "src/main.rs"

[dependencies]
# User-owned stack: mcport + blindplane path deps; blazingly-json matches mcport's crates.io pin.
mcport = { path = "../../../mcport" }
blazingly-json = "0.1.3"
blindplane-crypto = { path = "../../../blindplane/crates/blindplane-crypto" }
blindplane-access = { path = "../../../blindplane/crates/blindplane-access" }
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }

[lints.rust]
# Only `tls_macos` uses FFI into Apple Secure Transport for wss://.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
