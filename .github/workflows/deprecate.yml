name: Deprecate a published version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version to deprecate
        required: true
      message:
        description: Message npm shows on install
        required: true

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate the exact version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
        run: |
          case "$VERSION" in
            *[!0-9.a-zA-Z-]*) echo "refusing an unexpected version string"; exit 1 ;;
          esac
          npm deprecate "granttap-mcp@$VERSION" "$MESSAGE"
