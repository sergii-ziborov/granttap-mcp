name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # macOS: `prepublishOnly` enforces the coverage contract, and the helper,
    # OAuth service, and installer paths only execute on this platform.
    runs-on: macos-latest
    # The suite runs twice (npm test, then prepublishOnly's coverage run). On 23 November 2026 a slow
    # runner spent 28 minutes on the first and was cancelled at 45 inside `npm publish`.
    timeout-minutes: 75
    env:
      # V8's runner default heap is too small for the complete coverage merge.
      # Match the qualified sequential local gate and retain every check.
      NODE_OPTIONS: --max-old-space-size=6144
      GRANTTAP_TEST_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
